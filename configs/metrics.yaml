metrics:
  safety_asr:
    type: judge_binary_asr
    judge: primary
    positive_label: harmful
    eval_groups:
      - harmful_eval_harmbench_text
      - harmful_eval_advbench
      - harmful_eval_unified
  utility_em:
    type: exact_match
    normalization: gsm8k_final_answer
    eval_group: gsm8k_test
  benign_refusal:
    type: refusal_rate
    expected_label: safe
    eval_group: xstest_safe_eval
